<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3c70">
<meta name="description" content="Sistema de Controle de Serviços da Costureira Iraci: clientes, medidas, serviços, materiais, ordens de serviço, recebimentos e relatórios.">
<title>Costureira Iraci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topo">
    <div class="miolo">
      <div class="marca"><span class="marca-nome">Costureira Iraci</span><span class="marca-sub">Controle de serviços</span></div>
      <span class="hoje" id="hoje-data"></span>
    </div>
  </header>
  <nav class="abas" aria-label="Seções">
    <button type="button" data-tela="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>Início</button>
    <button type="button" data-tela="ordens"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="6.5" cy="17.5" r="2.5"/><path d="M8.6 8 20 18M8.6 16 20 6"/></svg>Ordens</button>
    <button type="button" data-tela="recebimentos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/></svg>Receber</button>
    <button type="button" data-tela="cadastros"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v4H4zM4 11h16v4H4zM4 17h10v3H4z"/></svg>Cadastros</button>
    <button type="button" data-tela="relatorios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Relatórios</button>
  </nav>
  <main class="conteudo miolo" id="tela"></main>
</div>

<div class="folha" id="folha" hidden>
  <div class="folha-fundo" data-acao="fechar-folha"></div>
  <section class="folha-painel" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
    <header class="folha-topo">
      <h2 id="folha-titulo"></h2>
      <button type="button" class="x" data-acao="fechar-folha" aria-label="Fechar">×</button>
    </header>
    <div class="folha-corpo" id="folha-corpo"></div>
    <p class="folha-erro" id="folha-erro" role="alert" hidden></p>
    <footer class="folha-botoes" id="folha-botoes"></footer>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
